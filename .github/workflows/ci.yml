name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'CODE_OF_CONDUCT.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'CODE_OF_CONDUCT.md'

permissions:
  id-token: write
  contents: write

jobs:
  test:
    runs-on: github-gpu
    env:
      MODULAR_NVPTX_COMPILER_PATH: /home/runner/work/mojo-gpu-puzzles/mojo-gpu-puzzles/.pixi/envs/default/bin/ptxas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v3
        with:
          path: |
            ~/.modular
            ~/.cache/modular
          key: ${{ runner.os }}-modular-${{ hashFiles('**/pixi.toml') }}

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.53.0
          cache: false
          post-cleanup: false

      - name: Check formatting
        shell: bash
        run: |
          pixi run format-check

      - name: Tests
        shell: bash
        run: |
          pixi run tests

